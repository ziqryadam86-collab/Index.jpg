name: Auto Update CCTV Snapshot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update-snapshot:
    runs-on: ubuntu-latest

    steps:
    - name: Semak fail repositori
      uses: actions/checkout@v3

    - name: Pasang FFmpeg (Alat penangkap gambar)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Tangkap gambar LIVE paling hujung (Ganti fail lama)
      run: |
        ffmpeg -live_start_index -1 -i "https://d2idp3hzkhjpih.cloudfront.net/out/v1/4b85d9c2bf97413eb0c9fd875599b837/index_3.m3u8" -vframes 1 -q:v 2 -y index.jpg

    - name: Muat naik dan ganti gambar index.jpg lama di GitHub Pages
      run: |
        git config --global user.name "GitHub Action Bot"
        git config --global user.email "action@github.com"
        git add index.jpg
        git commit -m "Auto-update CCTV snapshot [Live Frame]" || exit 0
        git push
        
